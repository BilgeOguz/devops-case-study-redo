name: CI

on: [push]
jobs:

  unitTesting:
    runs-on: ubuntu-latest
#    services: for later to test w database
    steps:
    - uses: actions/checkout@v7

    - name: Setup python - 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/mvc-flask-pymongo/requirements.txt
        pip install pytest

    - name: Unit Testing 
      run: pytest app/mvc-flask-pymongo/src/* # Not sure if this actually works ok 
      
  dockerImageBuild:
    runs-on: ubuntu latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build The Image and Export
      uses: docker/build-push-action@v7
      with:
          context: .
          file: app/mvc-flask-pymongo/Dockerfile
          tags: flask-api:1.0
          outputs: type=oci,dest=/tmp/flask-app-image.tar

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flask-api
        path: /tmp/flask-app-image.tar

  kubernetes-helm: 
    runs-on: ubuntu latest
    needs: dockerImageBuild
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Download the artifact
      uses: actions/download-artifact@v5
      with:
        name: flask-api
    
    - name: Load Docker the image from artifact
      run: |
            docker load --input /tmp/flask-app-image.tar
    - run: docker image ls

    - name: Deploy k8s
      uses: Azure/k8s-deploy@v7
      with:
        action: deploy
        manifests: |
          dir/k8s
        images: |
          flask-api:1.0

    - name: Deploy Helm
      uses: azure/setup-helm@v5

    - name: Lint
      run: helm lint helm/flask-app

    - name: Template
      run: helm template helm/flask-app
